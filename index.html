<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Treinamento - Engenharia Clínica</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="theme-color" content="#667eea" />
  </head>
  <body>
    <div class="app-container">
      <!-- Header compacto para mobile -->
      <header class="app-header">
        <div class="header-content">
          <i class="fas fa-hospital"></i>
          <h1>Eng. Clínica</h1>
        </div>
        <div class="hospital-name">Niterói D'Or</div>
      </header>

      <!-- Área principal do vídeo -->
      <main class="video-main">
        <div class="training-info">
          <h2>Kit de Ombro</h2>
          <p>Vídeo de treinamento de montagem e desmontagem de kit de ombro</p>
        </div>

        <div class="mobile-video-container">
          <div class="video-poster" id="videoPoster">
            <img
              src="img/Logo_Engenharia_clinica_niteroi_dor_videos.jpg"
              alt="Capa do vídeo de treinamento"
            />
            <button
              class="poster-play"
              id="posterPlayBtn"
              aria-label="Reproduzir vídeo"
            >
              <i class="fas fa-play"></i>
            </button>
          </div>

          <div class="video-player-wrapper" id="videoWrapper" hidden>
            <iframe
              id="cloudinaryPlayer"
              src="https://player.cloudinary.com/embed/?cloud_name=dndnngj0p&public_id=kit-ombro_oPgcYRRT_cgcrgb"
              width="100%"
              height="100%"
              frameborder="0"
              allowfullscreen
              allow="autoplay; encrypted-media; fullscreen"
              class="mobile-video-iframe"
            ></iframe>
          </div>
        </div>

        <div class="training-details">
          <div class="detail-item">
            <i class="fas fa-clock"></i>
            <span>Completo</span>
          </div>
          <div class="detail-item">
            <i class="fas fa-user-md"></i>
            <span>Técnico de Engenharia Clínica Wandreson</span>
          </div>
          <div class="detail-item">
            <i class="fas fa-calendar-alt"></i>
            <span>2026</span>
          </div>
        </div>
      </main>

      <!-- Rodapé mínimo -->
      <footer class="app-footer">
        <p>Hospital Niterói D'Or</p>
        <small>Departamento de Engenharia Clínica</small>
      </footer>
    </div>

    <script src="js/main.js"></script>
  </body>
</html>
